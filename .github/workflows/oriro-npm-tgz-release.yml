# ORIRO CLI — attach the prebuilt npm package (`oriro-<version>.tgz`) to the GitHub release.
# C2 lane: CI/build-tooling only (.github + install scripts). Does NOT touch src/.
#
# This is the asset that install.sh / install.ps1 download (curl|bash, irm|iex):
# a NO-binary, NO-signing prebuilt package. `npm pack` produces the same tarball that
# `npm publish` would, including dist/; native deps are auto-fetched by npm on install.
#
# Deliberately SEPARATE from oriro-npm-release.yml so the gated OIDC npm-publish path
# stays untouched. This job only `npm pack`s and uploads the .tgz to the release.

name: oriro-npm-tgz-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .tgz to (e.g. v2026.6.8)"
        type: string
        required: true
  release:
    types: [published]

permissions:
  contents: write   # required to upload the asset to the release

jobs:
  pack-and-attach:
    name: npm pack + attach tgz
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: npm pack (prebuilt package, no binary, no signing)
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # `npm pack` honours package.json "files" (ships dist/) and prints the tarball name.
          tgz="$(npm pack --silent)"
          test -f "$tgz" || { echo "::error::npm pack produced no tarball"; exit 1; }
          mv "$tgz" "out/$tgz"
          echo "tgz=out/$tgz" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: oriro-npm-tgz
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

      - name: Attach .tgz to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          files: ${{ steps.pack.outputs.tgz }}
