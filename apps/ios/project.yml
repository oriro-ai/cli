name: Oriro
options:
  bundleIdPrefix: ai.orirofoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  OriroKit:
    path: ../shared/OriroKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  Oriro:
    shared: true
    build:
      targets:
        Oriro: all
    test:
      targets:
        - OriroTests
        - OriroLogicTests
  OriroLogicTests:
    shared: true
    build:
      targets:
        OriroLogicTests: all
    test:
      targets:
        - OriroLogicTests
  OriroUITests:
    shared: true
    build:
      targets:
        OriroUITests: all
    test:
      targets:
        - OriroUITests
  OriroWatchApp:
    shared: true
    build:
      targets:
        OriroWatchApp: all

targets:
  Oriro:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: OriroShareExtension
        embed: true
      - target: OriroActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: OriroWatchApp
      - package: OriroKit
      - package: OriroKit
        product: OriroChatUI
      - package: OriroKit
        product: OriroProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/OriroKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: Sources/Oriro.entitlements
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ORIRO_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ORIRO_APNS_ENTITLEMENT_ENVIRONMENT: development
          ORIRO_PUSH_TRANSPORT: direct
          ORIRO_PUSH_DISTRIBUTION: local
          ORIRO_PUSH_RELAY_BASE_URL: ""
          ORIRO_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          ORIRO_APNS_ENTITLEMENT_ENVIRONMENT: production
          ORIRO_PUSH_TRANSPORT: direct
          ORIRO_PUSH_DISTRIBUTION: local
          ORIRO_PUSH_RELAY_BASE_URL: ""
          ORIRO_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Oriro
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.orirofoundation.app
            CFBundleURLSchemes:
              - oriro
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        OriroCanonicalVersion: "$(ORIRO_IOS_VERSION)"
        OriroAppGroupIdentifier: "$(ORIRO_APP_GROUP_ID)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(ORIRO_APP_BUNDLE_ID).bgrefresh"
        NSLocalNetworkUsageDescription: Oriro discovers and connects to your Oriro gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _oriro-gw._tcp
        NSCameraUsageDescription: Oriro can capture photos or short video clips when requested via the gateway.
        NSCalendarsUsageDescription: Oriro uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Oriro uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Oriro uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Oriro uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Oriro uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Oriro can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Oriro uses the microphone for realtime chat, voice wake, and push-to-talk.
        NSMotionUsageDescription: Oriro may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Oriro needs photo library access when you choose existing photos to share with your assistant.
        NSRemindersFullAccessUsageDescription: Oriro uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Oriro uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        OriroPushTransport: "$(ORIRO_PUSH_TRANSPORT)"
        OriroPushDistribution: "$(ORIRO_PUSH_DISTRIBUTION)"
        OriroPushRelayBaseURL: "$(ORIRO_PUSH_RELAY_BASE_URL)"
        OriroPushAPNsEnvironment: "$(ORIRO_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  OriroShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: OriroKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/OriroShareExtension.entitlements
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ORIRO_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Oriro Share
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        OriroAppGroupIdentifier: "$(ORIRO_APP_GROUP_ID)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  OriroActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/OriroActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ORIRO_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Oriro Activity
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  OriroWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(ORIRO_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(ORIRO_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ORIRO_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Oriro
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(ORIRO_APP_BUNDLE_ID)"
        WKApplication: true

  OriroTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Oriro
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Oriro.app/Oriro"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: OriroTests
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"

  OriroLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: OriroKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: OriroLogicTests
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"

  OriroUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Oriro
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(ORIRO_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(ORIRO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ORIRO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ORIRO_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Oriro
        SWIFT_VERSION: "5.0"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: OriroUITests
        CFBundleShortVersionString: "$(ORIRO_MARKETING_VERSION)"
        CFBundleVersion: "$(ORIRO_BUILD_VERSION)"
